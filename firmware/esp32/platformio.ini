; platformio.ini — Firmware ESP32 WROOM-32 del parqueadero inteligente.
;
; Reemplaza al firmware del Cortex-M4 de la BeaglePlay. Maneja los GPIOs
; (HC-SR04, barrera, watchdog) y se comunica con Linux por UART en lugar de RPMsg.
;
; Compilar/flashear:
;   pio run -t upload
; Monitor de depuración (UART0 / USB):
;   pio device monitor -b 115200

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; CORE_DEBUG_LEVEL=0 para que el SDK no inunde el UART0 con logs internos.
build_flags = -DCORE_DEBUG_LEVEL=0

; ── Opción servo real (descomentar si la barrera es un SG90/MG90 por PWM) ──
; lib_deps = madhephaestus/ESP32Servo@^3.0.5
