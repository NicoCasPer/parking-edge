# dashboard.conf — Configuración nginx para el dashboard de parking-edge.
# Proxy inverso hacia Flask en puerto 8080 con soporte WebSocket.

upstream parking_dashboard {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    # Redirect HTTP → HTTPS en producción (descomentar):
    # return 301 https://$host$request_uri;

    # Archivos estáticos del frontend
    location /static/ {
        alias /opt/parking-edge/web_dashboard/frontend/;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # WebSocket Socket.IO
    location /ws/ {
        proxy_pass         http://parking_dashboard;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 86400s;
    }

    # API y resto del dashboard (Flask)
    location / {
        proxy_pass         http://parking_dashboard;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
